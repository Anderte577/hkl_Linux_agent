name: Build HKL Agent Linux

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64

          - goos: linux
            goarch: arm64
            name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o HKL-Agent-${{ matrix.name }} main.go

      - name: Prepare installer
        run: |
          mkdir -p release
          cp HKL-Agent-${{ matrix.name }} release/HKL-Agent
          cp install.sh release/install.sh
          cp config.json release/config.json
          chmod +x release/install.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKL-Agent-${{ matrix.name }}
          path: release/
